  #       run: |
  #         if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
  #           echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> $GITHUB_ENV
  #           echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
  #         fi
  #         if [ -n "${{ secrets.APPLE_ID }}" ]; then
  #           echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
  #           echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
  #           echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
  #         fi
  #
  #     - name: Package
  #       run: npm run package:mac
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #
  #     - name: Upload build artifacts
  #       uses: actions/upload-artifact@v5
  #       with:
  #         name: release-macos-15-large
  #         path: |
  #           release/*.dmg
  #           release/*.zip
  #           release/*.yml
  #         if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.yml
