name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          # 固定 windows-2022：windows-latest(2025) 镜像缺少 node-gyp 可用的
          # Visual Studio C++ 工具链，会导致 better-sqlite3 重编译失败
          - os: windows-2022
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # runner 默认 Python 3.12+ 移除了 distutils，而根目录 node-gyp 9.x
      # （旧版 @electron/rebuild 依赖）的 gyp 仍 import distutils，
      # 故固定 Python 3.11 供 node-gyp 使用（npm_config_python 在下方 npm ci 生效）
      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # npm ci 会触发 apps/desktop 的 postinstall:
      # - electron-builder install-app-deps 为 Electron 重编译 better-sqlite3
      # - @qoder-ai/qoder-agent-sdk postinstall 按当前平台下载 qodercli 二进制
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_python: python

      # macOS 签名与公证（可选）：
      # 必须通过 bash + $GITHUB_ENV 条件写入，而非 env: 块直接引用 secrets。
      # 原因：GitHub Actions 的 env: 块不支持真正的"不设置"——
      # ${{ secrets.X || null }} 在 secret 为空时会将变量设为空字符串 ""，
      # electron-builder 拿到空 CSC_LINK 后 path.resolve(dir, "") 解析为工作目录本身，
      # 触发 "not a file" 错误。bash 条件确保仅当 secret 非空时才写入 GITHUB_ENV。
      - name: Setup macOS signing env
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          fi

      # 根脚本先构建所有 workspace，再走 prepackage:* 钩子
      # （拷贝 monorepo 内部包 + qodercli 二进制），最后 electron-builder
      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # electron-builder publish 到 GitHub Release 需要 GH_TOKEN
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
          if-no-files-found: error

  # Intel x64 macOS 构建：暂时禁用（macos-15-large 为付费 runner，需解决 GitHub 账单问题后启用）
  # large 后缀为 Intel runner，qodercli/原生模块会按 runner 架构自动处理，产物为 darwin-x64
  # build-intel-mac:
  #   name: Build (macos-15-large)
  #   runs-on: macos-15-large
  #   continue-on-error: true
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v5
  #       with:
  #         node-version: 22
  #         cache: npm
  #
  #     - name: Setup Python for node-gyp
  #       uses: actions/setup-python@v6
  #       with:
  #         python-version: '3.11'
  #
  #     - name: Install dependencies
  #       run: npm ci
  #       env:
  #         npm_config_python: python
  #
