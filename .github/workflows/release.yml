name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          # Intel x64 版 macOS：large 后缀为 Intel runner，
          # qodercli/原生模块会按 runner 架构自动处理，产物为 darwin-x64
          # - os: macos-15-large
            # script: package:mac
          # 固定 windows-2022：windows-latest(2025) 镜像缺少 node-gyp 可用的
          # Visual Studio C++ 工具链，会导致 better-sqlite3 重编译失败
          - os: windows-2022
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # runner 默认 Python 3.12+ 移除了 distutils，而根目录 node-gyp 9.x
      # （旧版 @electron/rebuild 依赖）的 gyp 仍 import distutils，
      # 故固定 Python 3.11 供 node-gyp 使用（npm_config_python 在下方 npm ci 生效）
      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # npm ci 会触发 apps/desktop 的 postinstall:
      # - electron-builder install-app-deps 为 Electron 重编译 better-sqlite3
      # - @qoder-ai/qoder-agent-sdk postinstall 按当前平台下载 qodercli 二进制
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_python: python

      # 根脚本先构建所有 workspace，再走 prepackage:* 钩子
      # （拷贝 monorepo 内部包 + qodercli 二进制），最后 electron-builder
      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # macOS 签名与公证（可选）：secrets 未配置时置为 null（即不注入该变量），
          # 避免 electron-builder 把空字符串 CSC_LINK 误当文件路径报 "not a file"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK || null }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || null }}
          APPLE_ID: ${{ secrets.APPLE_ID || null }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || null }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || null }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
